# =============================================================================
# Docker Compose — E2E Integration Test Stack
# =============================================================================
# Full end-to-end testing environment: infrastructure + application containers,
# with every outbound HTTP call going to WireMock so the stack has no external
# network dependencies.
#
# Infrastructure:
#   - AlloyDB Omni (PostgreSQL + pgvector)
#   - Google Pub/Sub Emulator
#   - db-migrations (Liquibase migration runner — init container, runs once)
#   - pubsub-init (creates topics/subscriptions in the emulator — init container)
#   - WireMock (stubs BOTH Congress.gov + Ollama via a single container)
#
# Application containers (one-shot: each runs to completion then exits):
#   - bill-metadata-pipeline
#   - bill-text-availability-checker
#   - bill-text-pipeline
#   - votes-pipeline          (House JSON + Senate XML → votes + vote_positions,
#                              publishes VoteRecordedEvent on vote-events topic)
#   - member-profile-pipeline (Congress.gov /v3/member/congress/{c} → members,
#                              publishes MemberUpdatedEvent on member-updated)
#   - lis-mapping-refresher   (senate.gov senators_cfm.xml → member_lis_mapping,
#                              publishes MemberUpdatedEvent on member-updated)
#   - amendments-pipeline     (Congress.gov /v3/amendment → amendments;
#                              no event emission, per §7.2)
#   - amendment-text-availability-checker  (polls candidates → Congress.gov
#                              /v3/amendment/.../text → publishes
#                              AmendmentTextAvailableEvent on amendment-text-available)
#   - amendment-text-pipeline (subscribes amendment-text-available-pipeline-sub →
#                              GovInfo CREC granule → chunks + embeddings →
#                              amendment_text_versions.fetched_at; no event emission)
#
# Note on Ollama: instead of running the real Ollama image (heavy, needs model
# weights), the single WireMock container also serves `POST /api/embed` with a
# canned 1024-dim embedding response. bill-text-pipeline points at WireMock via
# OLLAMA_BASE_URL=http://wiremock:8080. Semantic correctness isn't proven by
# this stack — wiring is. Phase 6 + production dev loops keep using real Ollama.
#
# Prerequisites:
#   1. Build fat JARs:
#        sbt "billMetadataPipeline/assembly" \
#            "billTextAvailabilityChecker/assembly" \
#            "billTextPipeline/assembly" \
#            "votesPipeline/assembly" \
#            "memberProfilePipeline/assembly" \
#            "lisMappingRefresher/assembly" \
#            "amendmentsPipeline/assembly" \
#            "amendmentTextAvailabilityChecker/assembly" \
#            "amendmentTextPipeline/assembly"
#   2. `docker compose -f docker-compose.e2e.yml build`
#
# Usage:
#   # End-to-end orchestrator (intended for CI + dev smoke):
#   ./scripts/docker-compose-e2e.sh
#
#   # Or bring it up manually:
#   docker compose -f docker-compose.e2e.yml up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------

  alloydb:
    image: google/alloydbomni:16.8.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: repcheck_e2e
      POSTGRES_USER: repcheck
      POSTGRES_PASSWORD: repcheck
    volumes:
      - alloydbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repcheck -d repcheck_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Run Liquibase migrations before any pipeline starts. Init container — exits
  # after completion; pipelines gate on service_completed_successfully.
  db-migrations:
    image: ghcr.io/eligio-taveras/repcheck-db-migrations-runner:0.1.38
    entrypoint: ["java", "-XX:MaxRAMPercentage=75.0", "-cp", "/opt/docker/lib/*", "repcheck.db.migrations.MigrationApp"]
    depends_on:
      alloydb:
        condition: service_healthy
    environment:
      DATABASE_HOST: alloydb
      DATABASE_PORT: "5432"
      DATABASE_NAME: repcheck_e2e
      DATABASE_USER: repcheck
      DATABASE_PASSWORD: repcheck

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=repcheck-e2e
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Init container: creates Pub/Sub topics and subscriptions in the emulator.
  # Pipelines gate on service_completed_successfully so they never read from a
  # missing subscription or write to a missing topic.
  pubsub-init:
    image: curlimages/curl:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    volumes:
      - ./scripts/pubsub-init.sh:/pubsub-init.sh:ro
    entrypoint: ["sh", "/pubsub-init.sh"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-e2e

  # Single WireMock container stubs BOTH Congress.gov paths and Ollama's
  # /api/embed. Mapping files under e2e/wiremock/mappings/ opt into each.
  wiremock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "8080:8080"
    volumes:
      - ./e2e/wiremock:/home/wiremock
    command: --verbose --global-response-templating
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application Containers (one-shot; each runs to completion then exits)
  # ---------------------------------------------------------------------------

  bill-metadata-pipeline:
    build:
      context: .
      dockerfile: bill-metadata-pipeline/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      PIPELINE_PARALLELISM: "1"
      PIPELINE_LOOKBACK_DAYS: "30"

  bill-summary-pipeline:
    build:
      context: .
      dockerfile: bill-summary-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused), args(1) = runId, args(2) = stepRunId.
    # See docker-compose.local.yml for the full justification — same pattern.
    command: ["cfg-unused", "e2e-bill-summary-run", "0"]
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      # E2E uses a tight 30-day window so WireMock fixtures stay manageable. Production default
      # (in application.conf) is 3650 days for the first-run lookback.
      PIPELINE_INITIAL_LOOKBACK_DAYS: "30"
      PIPELINE_WATERMARK_BUFFER: "1m"
      # PureConfig's HOCON reader can't reify a string env-var into List[Int], so we don't override
      # `congresses` from env here. application.conf default `[119]` (close enough to [118] for this
      # WireMock-stubbed run) drives the test. If the e2e fixture truly needs 118-only, override
      # application.conf via a profile or a Scala-level env-var parser.

  bill-text-availability-checker:
    build:
      context: .
      dockerfile: bill-text-availability-checker/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-e2e
      PUBSUB_TOPIC_NAME: bill-text-available
      PIPELINE_PARALLELISM: "1"

  bill-text-pipeline:
    build:
      context: .
      dockerfile: bill-text-pipeline/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # Pub/Sub — names match bill-text-pipeline's application.conf (GCP_PROJECT_ID,
      # EVENT_PUBLISHER_TOPIC, EVENT_SUBSCRIBER_SUBSCRIPTION — not the generic PUBSUB_*
      # names other pipelines use).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-e2e
      EVENT_PUBLISHER_TOPIC: bill-text-ingested
      EVENT_SUBSCRIBER_SUBSCRIPTION: bill-text-available-sub
      # Ollama — points at the single WireMock container. Stub lives at
      # e2e/wiremock/mappings/ollama-embed.json and returns 1024 zeros so
      # OllamaEmbeddingService.validateDimension passes against vector(1024) columns
      # (per migration 028; the bill-text-embedding model emits 1024-dim).
      OLLAMA_BASE_URL: http://wiremock:8080
      OLLAMA_MODEL_NAME: bill-text-embedding
      OLLAMA_EMBEDDING_DIMENSIONS: "1024"
      OLLAMA_TIMEOUT_SECONDS: "30"
      # Cross-bill embedder — small batch size + tight timeout so e2e fixtures land in their own
      # batches without waiting on cross-bill aggregation that production benefits from but e2e
      # would just see as latency.
      OLLAMA_EMBED_BATCH_SIZE: "5"
      OLLAMA_EMBED_BATCH_TIMEOUT: "200ms"
      PIPELINE_PARALLELISM: "1"
      # GovInfo — required by config schema. The e2e fixtures point at WireMock URLs (not the
      # Congress.gov BILLS-* shape) so the URL rewriter falls through to passthrough; the key value
      # is unused in practice. Stays settable for future fixtures that exercise the GovInfo path.
      GOVINFO_API_KEY: e2e-test-key
      GOVINFO_BASE_URL: http://wiremock:8080
      # Congress.gov API key — kept available for future api.congress.gov metadata calls in this pipeline.
      CONGRESS_GOV_API_KEY: e2e-test-key

  votes-pipeline:
    build:
      context: .
      dockerfile: votes-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused — PureConfig reads env),
    # args(1) = runId (surfaces in logs + events), args(2) = stepRunId.
    # PipelineBootstrap raises RunIdMissing if args(1) is absent.
    command: ["cfg-unused", "e2e-votes-run", "1"]
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # Congress.gov — House votes served under /v3/house-vote/* from WireMock.
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      # Senate — served under /senate/* from the same WireMock container.
      SENATE_BASE_URL: http://wiremock:8080/senate
      # Pin to two congresses for the WireMock fixture set:
      #   - 119: existing baseline (3 senate votes + 1 house list page)
      #   - 117: amendment-vote fixture (S.Amdt. 100 on H.R. 3684) — drives the S2 placeholder-upgrade
      #     e2e scenario where votes-pipeline writes an `amendments` placeholder via
      #     SenateVoteConverter.handleAmendment BEFORE amendments-pipeline runs and hydrates it.
      # The house-vote-list mapping is pinned to `/v3/house-vote/119/...` so 117 House requests 404
      # (HouseVotesApiClient treats list-404 as "no votes for this (congress, session)" and skips).
      # Per P6.H5 the pipeline normally derives the congress list from the bills table; in
      # the E2E stack we override via VOTES_CONGRESSES so the test is deterministic regardless
      # of how many bills the fixture seeds into the DB.
      VOTES_CONGRESSES: "117,119"
      # lookback-days=0 accepts every recorded fixture regardless of timestamp (the fixtures
      # were captured months ago; real lookback would filter them out).
      HOUSE_LOOKBACK_DAYS: "0"
      HOUSE_PARALLELISM: "1"
      HOUSE_PAGE_DELAY: 10ms
      SENATE_PARALLELISM: "1"
      SENATE_REQUEST_DELAY: 10ms
      # Pub/Sub (GCP_PROJECT_ID + VOTE_EVENTS_TOPIC — matches application.conf).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-e2e
      VOTE_EVENTS_TOPIC: vote-events

  member-profile-pipeline:
    build:
      context: .
      dockerfile: member-profile-pipeline/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # Congress.gov — baseUrl resolves `/v3/member/congress/{c}` via WireMock.
      # The pipeline follows `member.url` from the list response (HATEOAS) to
      # fetch detail, so `members-list-response.json`'s URLs are rewritten via
      # `members-abridge.py` to point at `http://wiremock:8080/v3/member/{bioguide}`.
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      # Multi-congress resolver: MEMBERS_CONGRESSES (comma-separated) replaced the
      # legacy PIPELINE_CONGRESS scalar in PR #80's refactor. Pinning to a single
      # congress here keeps the e2e WireMock stubs aligned (which only have data
      # for /v3/member/congress/119).
      MEMBERS_CONGRESSES: "119"
      PIPELINE_PARALLELISM: "1"
      PIPELINE_PAGE_DELAY: 10ms
      # Pub/Sub — publishes MemberUpdatedEvent on `member-updated` topic for
      # downstream consumers. `PUBSUB_PROJECT_ID` + `MEMBER_UPDATED_TOPIC`
      # match the keys in application.conf.
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-e2e
      MEMBER_UPDATED_TOPIC: member-updated

  lis-mapping-refresher:
    build:
      context: .
      dockerfile: lis-mapping-refresher/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # senate.gov senator XML — served under /senate/* from WireMock. The
      # pipeline's SenatorXmlParser expects senate.gov's /about/senator-lookup.xml
      # schema (<senators><senator><full_name>...). Override the production
      # host with the WireMock host so E2E tests hit the stub instead of the
      # real senate.gov endpoint.
      PIPELINE_SENATOR_XML_URL: http://wiremock:8080/senate/about/senator-lookup.xml
      PIPELINE_CURRENT_CONGRESS: "119"
      PIPELINE_PARALLELISM: "1"
      # Pub/Sub — publishes `member-updated` events when lis ↔ bioguide mapping
      # rows change. `PUBSUB_TOPIC_NAME` is the key the refresher reads
      # (different name from member-profile-pipeline's `MEMBER_UPDATED_TOPIC`
      # despite both landing on the same topic).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-e2e
      PUBSUB_TOPIC_NAME: member-updated

  # ---------------------------------------------------------------------------
  # Amendments — three new pipelines (§7.7 Phase 6 e2e half).
  # ---------------------------------------------------------------------------
  #
  # Wiring contract:
  #   amendments-pipeline             one-shot Cloud Run Job. Polls Congress.gov
  #                                   /v3/amendment, recursively hydrates parent
  #                                   chains, upserts into the `amendments` table.
  #                                   No event emission (§7.2).
  #   amendment-text-availability-checker  one-shot Cloud Run Job. Polls candidate
  #                                   amendments, fetches /amendment/.../text,
  #                                   publishes AmendmentTextAvailableEvent on the
  #                                   `amendment-text-available` topic for each
  #                                   newly-seen (versionType, formatType) tuple.
  #   amendment-text-pipeline         long-running Cloud Run Service. Subscribes
  #                                   to `amendment-text-available-pipeline-sub`,
  #                                   streams the granule via the CrecGovInfoUrlRewriter,
  #                                   chunks + embeds, writes amendment_text_chunks
  #                                   + amendment_text_versions.fetched_at. No event
  #                                   emission on completion — readiness is signaled
  #                                   by `fetched_at IS NOT NULL` (§7.6).
  #
  # All three point at the single WireMock container for Congress.gov + GovInfo.
  # AmendmentChainFixtures + the e2e/wiremock/__files/amendments/ fixtures cover
  # one bill (117-HR-3684), three amendments (SAMDT 100 + SUAMDT 200 chain plus
  # the fan-out SAMDT 101) and one text-version granule.

  amendments-pipeline:
    build:
      context: .
      dockerfile: amendments-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused — PureConfig reads env),
    # args(1) = runId (PipelineBootstrap.extractRunId parses args(1).toLong; non-numeric
    # raises RunIdMissing wrapping NumberFormatException), args(2) = stepRunId.
    # Use a numeric placeholder for e2e — there is no workflow_runs row in this slice,
    # so any Long is acceptable.
    command: ["cfg-unused", "1", "1"]
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # P1 sizing: max-connections >= parallelism × maxRecursionDepth + 5. With
      # the e2e overrides below (parallelism=1, maxRecursionDepth=3) we only need 8,
      # but keep the application.conf default of 45 to mirror production config.
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      AMENDMENTS_CONGRESSES_MIN: "102"
      AMENDMENTS_CONGRESSES_MAX: "119"
      # Lookback wide enough that fixture updateDate=2024-06-01 falls inside the
      # window (current date - lookbackDays). 100000 days ≈ 274 years, safe to
      # leave in place regardless of when CI runs.
      AMENDMENTS_LOOKBACK_DAYS: "100000"
      AMENDMENTS_PARALLELISM: "1"
      # Depth 3 matches the SAMDT 100 → bill chain; SUAMDT 200 → SAMDT 100 → bill
      # is the deepest path in fixtures. Production default 10 unchanged.
      AMENDMENTS_MAX_RECURSION_DEPTH: "3"

  amendment-text-availability-checker:
    build:
      context: .
      dockerfile: amendment-text-availability-checker/Dockerfile
    # Launcher contract: args(0) = runId (Long), args(1) = stepRunId (Long).
    # Both default to 0L if missing/unparseable, so this command is for log clarity rather than
    # a hard requirement — `args.lift(0).flatMap(_.toLongOption).getOrElse(0L)` won't crash.
    command: ["1", "1"]
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_API_BASE_URL: http://wiremock:8080/v3
      CONGRESS_GOV_API_KEY: e2e-test-key
      # `stale-after = 1ms` — must be > 0 per AmendmentTextCheckerConfig's
      # `require(staleAfter > Duration.Zero, ...)`. The SQL filter is
      # `last_text_check_at IS NULL OR older than staleAfter`, so freshly-
      # inserted amendments (NULL) qualify regardless. The default 4h is
      # only relevant after the first successful check; e2e is single-run.
      AMENDMENT_TEXT_CHECK_STALE_AFTER: "1ms"
      AMENDMENT_TEXT_CHECK_PARALLELISM: "1"
      # Pub/Sub — publishes AmendmentTextAvailableEvent on the
      # `amendment-text-available` topic created by pubsub-init.sh. The
      # default topic name in application.conf is dot-separated
      # (`amendment.text.available`); override to the hyphen form used in
      # the emulator + downstream subscription.
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-e2e
      PUBSUB_TOPIC_NAME: amendment-text-available

  amendment-text-pipeline:
    build:
      context: .
      dockerfile: amendment-text-pipeline/Dockerfile
    # Launcher contract: args(0) = runId (Long), args(1) = stepRunId (Long).
    # Same convention as the availability-checker — defaults to 0L on missing/unparseable, so
    # this is for log clarity. A non-zero runId here also activates the WorkflowStateUpdater.
    command: ["1", "1"]
    depends_on:
      alloydb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck_e2e
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # Pub/Sub — uses GCP_PROJECT_ID + EVENT_SUBSCRIBER_SUBSCRIPTION names per
      # application.conf (mirrors bill-text-pipeline's key naming, not the
      # PUBSUB_* convention).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-e2e
      # `amendment-text-available-pipeline-sub` is the subscription created by
      # pubsub-init.sh for this pipeline. The application.conf default is
      # `amendment-text-available-sub` — override here so subscriber binds to
      # the actually-created one.
      EVENT_SUBSCRIBER_SUBSCRIPTION: amendment-text-available-pipeline-sub
      # GovInfo — CrecGovInfoUrlRewriter maps congress.gov CREC URLs to
      # `${baseUrl}/packages/{pkg}/granules/{granule}/htm`. Point at WireMock so
      # the mapping in e2e/wiremock/mappings/amendment-text-govinfo-crec.json
      # serves the fixture content.
      GOVINFO_API_KEY: e2e-test-key
      GOVINFO_BASE_URL: http://wiremock:8080
      # Ollama — same shared WireMock stub as bill-text-pipeline (1024-dim
      # zero-vector response from ollama-embed.json).
      OLLAMA_BASE_URL: http://wiremock:8080
      OLLAMA_MODEL_NAME: bill-text-embedding
      OLLAMA_EMBEDDING_DIMENSIONS: "1024"
      OLLAMA_TIMEOUT_SECONDS: "30"
      OLLAMA_EMBED_BATCH_SIZE: "5"
      OLLAMA_EMBED_BATCH_TIMEOUT: "200ms"
      PIPELINE_PARALLELISM: "1"

volumes:
  alloydbdata:
    driver: local
