name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**", "chore/**", "claude/**", "dev/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting (Scalafmt)
        run: sbt scalafmtCheckAll

      - name: Compile (includes WartRemover + tpolecat checks)
        run: sbt compile

      - name: Check Scalafix rules
        run: sbt "scalafixAll --check"

      - name: Pull Docker images for integration tests
        run: |
          docker pull google/alloydbomni:16.8.0 &
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators &
          wait

      - name: Run all tests with coverage (unit + Docker integration)
        # Runs non-Docker tests first (`test` excludes @DockerRequired), then Docker-backed
        # integration tests (`dockerTest` includes only @DockerRequired and runs each
        # subproject's test task SEQUENTIALLY). The parallel variant (`dockerTestParallel`)
        # spins up a container per subproject concurrently — on GHA's 7GB runner, aggregating
        # coverage across all of them afterwards OOMs the post-test `coverageReport` phase
        # (exit 143 SIGTERM observed ~46s after "All tests passed"). The sequential runner
        # uses dramatically less peak memory at the cost of wall-clock. Both phases run in
        # the same sbt-scoverage session so measurement data accumulates into a single
        # combined report — no `clean` between runs.
        timeout-minutes: 30
        run: sbt coverage test dockerTest coverageReport

      - name: Upload combined coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: |
            bills-common/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-metadata-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-text-availability-checker/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-text-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            lis-mapping-refresher/target/scala-3.7.3/scoverage-report/scoverage.xml
            member-profile-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            members-common/target/scala-3.7.3/scoverage-report/scoverage.xml
            votes-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml

      - name: Enforce per-file coverage threshold
        # Parses every subproject's scoverage.xml and fails if any instrumented file is below
        # the configured minimum statement coverage. Files excluded via `coverageExcludedFiles`
        # in build.sbt are already omitted from the XML and naturally skipped here.
        # Codecov's `patch` check (codecov.yml) enforces coverage on changed lines only; this
        # step is stricter — it gates on global per-file coverage and surfaces violations
        # directly in the CI log without waiting on Codecov.
        # Placed after Codecov upload so Codecov's report is populated even when this gate
        # fails, giving reviewers a second data source while fixing the violation.
        run: python3 scripts/check-coverage.py --min 95

  e2e-gcp:
    runs-on: ubuntu-latest
    # No `needs: build` — the E2E job runs against real GCP Pub/Sub, doesn't contribute to
    # coverage, and shares no state with the `build` job. Running both in parallel cuts wall
    # time from build + e2e to max(build, e2e).
    concurrency:
      group: e2e-gcp-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      packages: read
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Pull AlloyDB Omni image
        run: docker pull google/alloydbomni:16.8.0

      - name: Run E2E tests against real GCP Pub/Sub
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          INTEGRATION_TEST_SA: ${{ secrets.GCP_INTEGRATION_TEST_SA }}
        run: |
          sbt 'set billTextPipeline / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "com.repcheck.tags.E2ETest"))' 'billTextPipeline / test'

  doc-generator:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Compile doc generator
        run: sbt docGenerator/compile

      - name: Run doc generator tests
        run: sbt docGenerator/test
