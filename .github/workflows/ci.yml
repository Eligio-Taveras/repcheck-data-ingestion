name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**", "chore/**", "ci/**", "claude/**", "dev/**", "perf/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting (Scalafmt)
        run: sbt scalafmtCheckAll

      - name: Compile (includes WartRemover + tpolecat checks)
        run: sbt compile

      - name: Check Scalafix rules
        run: sbt "scalafixAll --check"

      - name: Pull Docker images for integration tests
        run: |
          docker pull google/alloydbomni:16.8.0 &
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators &
          wait

      # ----------------------------------------------------------------------
      # Tests are split into one step per Docker-using subproject so a failure
      # isolates to a specific subproject AND each step runs in a fresh sbt JVM
      # (lower peak memory than one long `dockerTestParallel` session). scoverage
      # data accumulates on disk across invocations — `coverageReport` at the end
      # reads every step's measurements as a single combined report.
      # ----------------------------------------------------------------------

      - name: Run non-Docker tests with coverage
        timeout-minutes: 15
        run: sbt coverage test

      - name: Run billsCommon Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set billsCommon / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'billsCommon/test'

      - name: Run membersCommon Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set membersCommon / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'membersCommon/test'

      - name: Run billTextPipeline Docker tests
        # Higher timeout than other subprojects: billTextPipeline carries the heaviest
        # integration suite (Pub/Sub emulator round-trips via BillTextProcessorSpec + the
        # DockerE2ESpec end-to-end flow). Previous run timed out at 10 min mid-BillTextProcessorSpec.
        timeout-minutes: 20
        run: |
          sbt coverage \
            'set billTextPipeline / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'billTextPipeline/test'

      - name: Run billTextAvailabilityChecker Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set billTextAvailabilityChecker / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'billTextAvailabilityChecker/test'

      - name: Run memberProfilePipeline Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set memberProfilePipeline / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'memberProfilePipeline/test'

      - name: Run lisMappingRefresher Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set lisMappingRefresher / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'lisMappingRefresher/test'

      - name: Run votesPipeline Docker tests
        timeout-minutes: 10
        run: |
          sbt coverage \
            'set votesPipeline / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "DockerRequired"), Tests.Argument(TestFrameworks.ScalaTest, "-oD"))' \
            'votesPipeline/test'

      - name: Generate combined coverage reports
        timeout-minutes: 10
        run: sbt coverageReport

      - name: Upload combined coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: |
            bills-common/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-metadata-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-text-availability-checker/target/scala-3.7.3/scoverage-report/scoverage.xml
            bill-text-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            lis-mapping-refresher/target/scala-3.7.3/scoverage-report/scoverage.xml
            member-profile-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml
            members-common/target/scala-3.7.3/scoverage-report/scoverage.xml
            votes-pipeline/target/scala-3.7.3/scoverage-report/scoverage.xml

      - name: Enforce per-file coverage threshold
        # Parses every subproject's scoverage.xml and fails if any instrumented file is below
        # the configured minimum statement coverage. Files excluded via `coverageExcludedFiles`
        # in build.sbt are already omitted from the XML and naturally skipped here.
        # Codecov's `patch` check (codecov.yml) enforces coverage on changed lines only; this
        # step is stricter — it gates on global per-file coverage and surfaces violations
        # directly in the CI log without waiting on Codecov.
        # Placed after Codecov upload so Codecov's report is populated even when this gate
        # fails, giving reviewers a second data source while fixing the violation.
        run: python3 scripts/check-coverage.py --min 95

  e2e-gcp:
    runs-on: ubuntu-latest
    # No `needs: build` — the E2E job runs against real GCP Pub/Sub, doesn't contribute to
    # coverage, and shares no state with the `build` job. Running both in parallel cuts wall
    # time from build + e2e to max(build, e2e).
    concurrency:
      group: e2e-gcp-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      packages: read
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Pull AlloyDB Omni image
        run: docker pull google/alloydbomni:16.8.0

      - name: Run E2E tests against real GCP Pub/Sub
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          INTEGRATION_TEST_SA: ${{ secrets.GCP_INTEGRATION_TEST_SA }}
        run: |
          sbt 'set billTextPipeline / Test / testOptions := Seq(Tests.Argument(TestFrameworks.ScalaTest, "-n", "com.repcheck.tags.E2ETest"))' 'billTextPipeline / test'

      # -------------------------------------------------------------------------
      # Full-stack docker-compose E2E test (Tier 3 — wiring validation).
      #
      # Runs `docker-compose-e2e.sh` which brings up the whole compose stack
      # (AlloyDB Omni, Pub/Sub emulator, WireMock serving both Congress.gov
      # + Ollama stubs), executes each pipeline container end-to-end against
      # canned fixtures, then runs `docker-compose-e2e-assert.sh` to verify
      # observable stack state (row counts, bill-linking, events delivered).
      #
      # Catches bugs unit + per-pipeline E2E specs can't: wrong env var names,
      # wrong depends_on ordering, missing pubsub topic init, WireMock URL
      # mismatches, schema-vs-migrator version drift. Uses emulators only,
      # so no GCP cost. Runs after the real-GCP step so any cross-cloud flake
      # is attributable; not coupled to the GCP credentials above.
      # -------------------------------------------------------------------------
      - name: Run full-stack docker-compose E2E test
        timeout-minutes: 20
        run: ./scripts/docker-compose-e2e.sh

  doc-generator:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Compile doc generator
        run: sbt docGenerator/compile

      - name: Run doc generator tests
        run: sbt docGenerator/test
