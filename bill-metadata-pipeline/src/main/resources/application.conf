# Bill Metadata Pipeline configuration
# See PureConfig auto-derivation for the config case class

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  page-size = ${?CONGRESS_API_PAGE_SIZE}
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. Default 750ms keeps this pipeline's
  # call rate at ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr free-tier rate limit.
  # Aligned with bill-text-availability-checker + member-profile-pipeline since all three share the same key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  # Retry schedule for Congress.gov fetch failures. Bumped from max-retries=3, initial=10ms after
  # observing a connection drop ("Reached End Of Stream") on a paginated backfill where the old
  # 70ms total backoff was nowhere near long enough for the upstream socket / rate-limit window
  # to recover. New schedule: 1s, 2s, 4s, 8s, 16s, 32s, 60s (capped), 60s, 60s, 60s — total ~250s
  # before the page-level error propagates and aborts the run via the fail-loud handler in
  # BillMetadataProcessor.
  retry {
    max-retries = 10
    initial-backoff-ms = 1000
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  # Max retries per anomalously short page mid-stream (CongressGovPaginatedClient.fetchAll). Default
  # 10 matches the historical hardcoded value; surface as configurable so we can tune it without
  # code changes if upstream behavior shifts.
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  lookback-days = 30
  lookback-days = ${?PIPELINE_LOOKBACK_DAYS}
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  # Floor on `bill.congress` for items emitted by the Congress.gov listing endpoint. A 30-day
  # production sweep can surface pre-modern bills whose updateDate has been bumped by a republish
  # at api.congress.gov, even though their underlying detail-level schema cannot be deserialized
  # by our DTO codecs. 102 = the 102nd Congress (Jan 1991 – Jan 1993); older are dropped at the
  # list-item level before any detail fetch or insert is attempted. Set to 1 (or remove the
  # PIPELINE_MIN_CONGRESS override and comment this default out) to disable.
  min-congress = 102
  min-congress = ${?PIPELINE_MIN_CONGRESS}
}
