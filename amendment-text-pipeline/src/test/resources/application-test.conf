# Test configuration overrides for the Amendment Text Pipeline.

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "repcheck"
  password = "repcheck"
  max-connections = 2
}

pipeline {
  parallelism = 1
  download-timeout-seconds = 5
  page-delay = 1ms
  gov-info-api-key = "test-key"
  gov-info-base-url = "http://localhost:8080"
  gov-info-permits = 1
  gov-info-http {
    connect-timeout = 5s
    request-timeout = 5s
    max-total-connections = 5
    idle-timeout = 5s
  }
  ollama-http {
    connect-timeout = 5s
    request-timeout = 5s
    max-total-connections = 5
    idle-timeout = 5s
  }
}

event-subscriber {
  project-id = "repcheck-test"
  subscription-id = "test-amendment-text-available-sub"
  max-messages = 10
  pull-timeout = 5s
}

failure-handler {
  max-retries = 1
}

embedding {
  base-url = "http://localhost:11434"
  model-name = "bill-text-embedding"
  dimensions = 1024
  timeout-seconds = 5
  max-chunk-chars = 12000
  embed-batch-size = 50
  embed-batch-timeout = 1s
  embed-queue-capacity-multiplier = 10
}
