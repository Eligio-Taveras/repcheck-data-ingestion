# Amendment Text Pipeline configuration
# Mirror of bill-text-pipeline/application.conf — see PureConfig auto-derivation for the
# AmendmentTextPipelinePipeline.AppConfig case class.

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  download-timeout-seconds = 60
  download-timeout-seconds = ${?DOWNLOAD_TIMEOUT_SECONDS}
  page-delay = 100ms
  page-delay = ${?PAGE_DELAY}
  # GPO's GovInfo API serves CREC content (mirroring the Cloudflare-fronted www.congress.gov/.../crec/...).
  # Free signup at https://www.govinfo.gov/api-signup. Empty default keeps PureConfig load succeeding when
  # GOVINFO_API_KEY isn't set (e.g., in tests not exercising the GovInfo path); production runs always set it.
  # Empty key surfaces at runtime as 401/403 from api.govinfo.gov on the first download → Systemic.
  gov-info-api-key = ""
  gov-info-api-key = ${?GOVINFO_API_KEY}
  gov-info-base-url = "https://api.govinfo.gov"
  gov-info-base-url = ${?GOVINFO_BASE_URL}
}

event-subscriber {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  subscription-id = "amendment-text-available-sub"
  subscription-id = ${?EVENT_SUBSCRIBER_SUBSCRIPTION}
  max-messages = 100
  max-messages = ${?EVENT_SUBSCRIBER_MAX_MESSAGES}
  pull-timeout = 30s
  pull-timeout = ${?EVENT_SUBSCRIBER_PULL_TIMEOUT}
}

failure-handler {
  max-retries = 3
  max-retries = ${?FAILURE_HANDLER_MAX_RETRIES}
}

embedding {
  base-url = "http://localhost:11434"
  base-url = ${?OLLAMA_BASE_URL}
  # Reuses the same tuned qwen3-embedding:0.6b deployment as the bill-side embedder; per §7.6 spec, sharing the
  # model means a single inference deployment + cross-entity semantic comparability for downstream analysis.
  model-name = "bill-text-embedding"
  model-name = ${?OLLAMA_MODEL_NAME}
  dimensions = 1024
  dimensions = ${?OLLAMA_EMBEDDING_DIMENSIONS}
  timeout-seconds = 30
  timeout-seconds = ${?OLLAMA_TIMEOUT_SECONDS}
  max-chunk-chars = 12000
  max-chunk-chars = ${?OLLAMA_MAX_CHUNK_CHARS}
  embed-batch-size = 50
  embed-batch-size = ${?OLLAMA_EMBED_BATCH_SIZE}
  embed-batch-timeout = 1s
  embed-batch-timeout = ${?OLLAMA_EMBED_BATCH_TIMEOUT}
  embed-queue-capacity-multiplier = 10
  embed-queue-capacity-multiplier = ${?OLLAMA_EMBED_QUEUE_CAPACITY_MULTIPLIER}
}
