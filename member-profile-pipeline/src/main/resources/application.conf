# Member Profile Pipeline configuration

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  page-size = ${?CONGRESS_API_PAGE_SIZE}
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. Default 750ms keeps this pipeline's
  # call rate at ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr free-tier rate limit.
  # Aligned with bill-metadata-pipeline + bill-text-availability-checker since all three share the same key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # Optional list of congresses to ingest. Defaults to empty so the pipeline queries
  # the bills table at startup for `SELECT DISTINCT congress` and ingests every congress
  # that has at least one bill in the DB.
  #
  # Three resolution layers, in order of precedence (highest first):
  #   1. MEMBERS_CONGRESSES env var (comma-separated, e.g. "117,118,119") — read at runtime
  #      via sys.env in `MemberProfilePipeline.resolveCongresses`. NOT bound here because HOCON
  #      cannot parse a comma-separated string as `List[Int]`.
  #   2. This config-file list (e.g. for test profiles).
  #   3. DB-derived from the bills table.
  congresses = []
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  page-delay = 500ms
  page-delay = ${?PIPELINE_PAGE_DELAY}
  event-publish-retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?PUBSUB_PROJECT_ID}
  topic-name = "member-events"
  topic-name = ${?PUBSUB_TOPIC_NAME}
  source = "member-profile-pipeline"
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?PUBSUB_PROJECT_ID}
  topic-name = "member-updated"
  topic-name = ${?MEMBER_UPDATED_TOPIC}
  source = "member-profile-pipeline"
}
