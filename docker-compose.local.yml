# =============================================================================
# Docker Compose — Local Development Stack (Cron-Scheduled, Long-Running)
# =============================================================================
# Simulates the full production pipeline locally. Infrastructure services run
# continuously; Ofelia triggers each pipeline on a cron schedule, just like
# Cloud Scheduler would in GCP.
#
# Prerequisites:
#   1. Provide CONGRESS_GOV_API_KEY + GOVINFO_API_KEY to the launching shell.
#      Two supported paths (see .env.example for full details):
#        a. Windows User env + helper (recommended):
#             source scripts/ci-functions.sh && loadDevSecrets
#        b. Copy .env.example to .env and fill in literal values (gitignored).
#      Compose substitutes ${VAR} from the launching shell at up-time — keys
#      with empty values produce 401 errors mid-stream (api.govinfo.gov etc).
#   2. Docker Desktop running
#   3. Build fat JARs and Docker images:
#        sbt "billMetadataPipeline/assembly" "billTextAvailabilityChecker/assembly" "billTextPipeline/assembly"
#        docker compose -f docker-compose.local.yml build
#
# Usage:
#   # Start everything (long-running, cron-scheduled):
#   docker compose -f docker-compose.local.yml up -d
#
#   # Watch pipeline logs:
#   docker compose -f docker-compose.local.yml logs -f ofelia
#   docker compose -f docker-compose.local.yml logs -f bill-metadata-pipeline
#
#   # Run only infrastructure (DB + Pub/Sub + Ollama):
#   docker compose -f docker-compose.local.yml up -d alloydb pubsub-emulator pubsub-init ollama
#
#   # Trigger a one-off pipeline run (outside the schedule):
#   docker compose -f docker-compose.local.yml up bill-metadata-pipeline
#
#   # Tear down (preserves data volumes):
#   docker compose -f docker-compose.local.yml down
#
#   # Tear down and delete all data:
#   docker compose -f docker-compose.local.yml down -v
#
# Pipeline execution order (enforced by Ofelia schedule offsets):
#   1. bill-metadata-pipeline         — fetches bill metadata from Congress.gov → DB
#   2. bill-text-availability-checker — scans DB for bills needing text → Pub/Sub
#   3. bill-text-pipeline             — subscribes to Pub/Sub → downloads text → DB
#   4. member-profile-pipeline        — fetches member profiles from Congress.gov → DB → member-updated events
#   5. lis-mapping-refresher          — fetches senate.gov XML → maps LIS IDs → DB → member-updated events
#   6. committee-membership-refresher — fetches committee metadata + memberships → DB
#   7. votes-pipeline                 — fetches House + Senate votes → DB → vote-events events
#                                       (runs AFTER lis-mapping-refresher so LIS→bioguide map is fresh)
#   8. amendments-pipeline            — fetches Congressional amendments → DB (placeholders + chain hydration)
#   9. amendment-text-availability-checker — scans DB for amendments needing text → Pub/Sub
#  10. amendment-text-pipeline        — subscribes to Pub/Sub → downloads CREC text via GovInfo → DB
#                                       (amendments triplet runs on a separate 4-hour cadence per
#                                        IMPLEMENTATION_PLAN §6.3 L10: 30/50 offset gives amendments-
#                                        pipeline time to complete before the checker scans)
#
# Schedule defaults (override via .env):
#   BILL_METADATA_SCHEDULE          = 0 */6 * * *           (every 6 hours)
#   BILL_TEXT_AVAILABILITY_SCHEDULE = 0 1,7,13,19 * * *     (every 6 hours, offset +1h)
#   BILL_TEXT_PIPELINE_SCHEDULE     = 0 2,8,14,20 * * *     (every 6 hours, offset +2h)
#   MEMBER_PROFILE_SCHEDULE         = 0 3,9,15,21 * * *     (every 6 hours, offset +3h)
#   LIS_MAPPING_SCHEDULE            = 0 4,10,16,22 * * *    (every 6 hours, offset +4h)
#   VOTES_SCHEDULE                  = 0 5,11,17,23 * * *    (every 6 hours, offset +5h)
#   AMENDMENTS_SCHEDULE             = 30 */4 * * *          (every 4 hours, minute 30)
#   AMENDMENT_TEXT_CHECK_SCHEDULE   = 50 */4 * * *          (every 4 hours, minute 50 — +20m offset)
#   AMENDMENT_TEXT_PIPELINE_SCHEDULE= 0 1,5,9,13,17,21 * * *(every 4 hours, +30m after the checker)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------

  alloydb:
    image: google/alloydbomni:16.8.0
    command: postgres -c max_connections=1000
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: repcheck
      POSTGRES_USER: repcheck
      POSTGRES_PASSWORD: repcheck
    volumes:
      - alloydbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repcheck -d repcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Run database migrations before any pipeline starts
  db-migrations:
    image: ghcr.io/eligio-taveras/repcheck-db-migrations-runner:0.1.41
    entrypoint: ["java", "-XX:MaxRAMPercentage=75.0", "-cp", "/opt/docker/lib/*", "repcheck.db.migrations.MigrationApp"]
    depends_on:
      alloydb:
        condition: service_healthy
    environment:
      DATABASE_HOST: alloydb
      DATABASE_PORT: "5432"
      DATABASE_NAME: repcheck
      DATABASE_USER: repcheck
      DATABASE_PASSWORD: repcheck

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=repcheck-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Init container: creates Pub/Sub topics and subscriptions in the emulator
  pubsub-init:
    image: curlimages/curl:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    volumes:
      - ./scripts/pubsub-init.sh:/pubsub-init.sh:ro
    entrypoint: ["sh", "/pubsub-init.sh"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local

  # Init container: seeds a workflow_runs row so amendments-pipeline's
  # WorkflowStateUpdater.recordStepStarted has a parent row to FK against.
  # AmendmentsPipeline.runWithFactories writes workflow_run_steps unconditionally
  # (unlike the bill-side which either hardcodes runId=0L and skips the updater,
  # or wraps it in Optional). Without this seed the pipeline crashes on first
  # run with `workflow_run_steps_workflow_run_id_fkey` (see PR #125 diagnosis).
  # Idempotent via ON CONFLICT (id) DO NOTHING — safe across compose restarts.
  workflow-runs-init:
    image: postgres:16-alpine
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: repcheck
    entrypoint:
      - sh
      - -c
      - |
        psql -h alloydb -U repcheck -d repcheck -v ON_ERROR_STOP=1 -c "
          INSERT INTO workflow_runs (id, workflow_name, status, triggered_by, started_at)
          VALUES (1, 'local-amendments-stack', 'running'::workflow_status_type, 'compose-local', NOW())
          ON CONFLICT (id) DO NOTHING;
        "

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      # Performance tuning — see ollama/Modelfile for the full reasoning.
      # Note: flash attention + quantized KV cache were tried first but qwen3-embedding doesn't support
      # FA (Ollama logs `flash attention enabled but not supported by model`), and KV-cache quantization
      # requires FA, so both became no-ops. Removed to keep the config honest.
      # Keep the model resident across embed calls (default unloads after 5 min idle → 5-10 s reload penalty).
      OLLAMA_KEEP_ALIVE: 24h
      # Concurrent request slots. GPU is single-tenant so requests serialize on the device anyway, but
      # this lets the server queue bursts efficiently rather than rejecting.
      OLLAMA_NUM_PARALLEL: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Cron Scheduler
  # ---------------------------------------------------------------------------
  # Ofelia triggers pipeline containers on a cron schedule. Each job runs a
  # stopped container via `docker start`. The containers exit after each run
  # and Ofelia restarts them on the next scheduled tick.

  ofelia:
    image: mcuadros/ofelia:0.3.16
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
      workflow-runs-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    command: daemon --config=/etc/ofelia/config.ini
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia-config.ini:/etc/ofelia/config.ini:ro

  # ---------------------------------------------------------------------------
  # Pipeline Containers (started by Ofelia on schedule)
  # ---------------------------------------------------------------------------
  # These containers are created but NOT started automatically (profiles: cron).
  # Ofelia starts them on schedule. They run to completion then stop, waiting
  # for the next scheduled tick.

  bill-metadata-pipeline:
    container_name: bill-metadata-pipeline
    build:
      context: .
      dockerfile: bill-metadata-pipeline/Dockerfile
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PIPELINE_LOOKBACK_DAYS: ${PIPELINE_LOOKBACK_DAYS:-30}
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-1}
    restart: "no"

  # Maps Congress.gov /summaries[/{congress}] feed to bills.expected_text_version_code via
  # SummaryVersionCodeMapper. Acts as the advancing writer alongside bill-metadata-pipeline's
  # introduced floor — the cooperative-write contract via TextVersionCode.progressionOrder
  # guarantees neither pipeline can downgrade the other's writes. Reads watermark from
  # workflow_run_steps; first-run fallback is initial-lookback-days (10y default).
  bill-summary-pipeline:
    container_name: bill-summary-pipeline
    build:
      context: .
      dockerfile: bill-summary-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused — PureConfig reads env),
    # args(1) = runId, args(2) = stepRunId. extractStepRunId raises
    # StepRunIdInvalid without args(2). For local-stack runs we pass `"0"`
    # placeholders since the launcher / workflow_run_steps integration isn't
    # wired up in docker-compose yet.
    command: ["cfg-unused", "local-bill-summary-run", "0"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      # 10-year first-run lookback per cross-pipeline policy. After the first successful run
      # the watermark from workflow_run_steps takes over and incremental ticks fetch only the
      # delta since the prior run's completed_at minus watermark-buffer.
      PIPELINE_INITIAL_LOOKBACK_DAYS: ${PIPELINE_INITIAL_LOOKBACK_DAYS:-3650}
      PIPELINE_WATERMARK_BUFFER: ${PIPELINE_WATERMARK_BUFFER:-5m}
      # Optional comma-separated congress list. Empty/unset = derive from `SELECT DISTINCT congress
      # FROM bills` (matches votes-pipeline + member-profile-pipeline). Set to e.g. "117,118,119"
      # to override the DB-derived default for targeted backfill.
      BILL_SUMMARY_CONGRESSES: ${BILL_SUMMARY_CONGRESSES:-}
    restart: "no"

  bill-text-availability-checker:
    container_name: bill-text-availability-checker
    build:
      context: .
      dockerfile: bill-text-availability-checker/Dockerfile
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local
      PUBSUB_TOPIC_NAME: bill-text-available
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-2}
      # Inherit the application.conf page-delay default (750ms). The shared Congress.gov key has a
      # ~5000 req/hour (≈1.39/sec) budget across all pipelines, so the previous 50ms (~20 req/sec)
      # override caused 429 storms when several pipelines ran at once. Override per-run if needed.
      CONGRESS_API_PAGE_DELAY: ${CONGRESS_API_PAGE_DELAY:-750ms}
    restart: "no"

  bill-text-pipeline:
    container_name: bill-text-pipeline
    build:
      context: .
      dockerfile: bill-text-pipeline/Dockerfile
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # GovInfo API key — required for downloading bill text bodies from api.govinfo.gov (replaces the
      # Cloudflare-fronted www.congress.gov path that 403s ~30% of raw HTTP requests). Sign up at
      # https://www.govinfo.gov/api-signup. Same passthrough shape as CONGRESS_GOV_API_KEY: must be set
      # in the host's shell env.
      GOVINFO_API_KEY: ${GOVINFO_API_KEY}
      # Congress.gov API key — kept available for any future calls in this pipeline that need api.congress.gov
      # (e.g. text-version metadata lookups, bill detail re-fetches). Not consumed by the downloader today.
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-local
      EVENT_PUBLISHER_TOPIC: bill-text-ingested
      EVENT_SUBSCRIBER_SUBSCRIPTION: bill-text-available-sub
      # Single Pull RPC drains up to N messages then the stream exits (see BillTextPipelinePipeline.buildStream).
      # Pub/Sub caps a single Pull at 1000 — set at the cap so backfill drains in fewer Ofelia ticks.
      EVENT_SUBSCRIBER_MAX_MESSAGES: ${EVENT_SUBSCRIBER_MAX_MESSAGES:-1000}
      OLLAMA_BASE_URL: http://ollama:11434
      # Tuned model variant baked by ollama/Dockerfile (Modelfile-derived from qwen3-embedding:0.6b).
      # The 0.6B model frees ~5 GB of VRAM vs the 4B baseline on an 8 GB GPU, lifting GPU-saturation
      # batch size from ~10 to ~50 (~5× throughput on the batch-friendly /api/embed array path).
      # Tag is generic ("bill-text-embedding") so future base-model swaps don't move this contract.
      OLLAMA_MODEL_NAME: bill-text-embedding
      OLLAMA_EMBEDDING_DIMENSIONS: "1024"
      OLLAMA_TIMEOUT_SECONDS: "60"
      OLLAMA_MAX_CHUNK_CHARS: ${OLLAMA_MAX_CHUNK_CHARS:-12000}
      OLLAMA_EMBED_BATCH_SIZE: ${OLLAMA_EMBED_BATCH_SIZE:-50}
      # Cross-bill embedder timeout: max wall-clock the worker fiber waits to fill a batch of
      # `OLLAMA_EMBED_BATCH_SIZE` before firing whatever's queued. With sparse traffic (e.g., a single
      # 1-chunk bill arrives, no others queued) the timeout is what flushes the batch — pick this such
      # that worst-case latency per bill is acceptable. 1s is a reasonable default; tighten for lower
      # latency, loosen to maximize cross-bill batching when traffic is steady.
      OLLAMA_EMBED_BATCH_TIMEOUT: ${OLLAMA_EMBED_BATCH_TIMEOUT:-1s}
      # Parallelism = how many concurrent bills the processor pulls off the Pub/Sub subscription
      # and runs through download/extract/chunk in parallel. Each parallel slot feeds chunks into the
      # cross-bill embedder's queue, so higher parallelism → bigger steady-state batches at Ollama.
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-32}
      # HikariCP pool sizing: parallelism + 1 embedder worker + headroom for the event publisher's
      # transactor + transient lookups. AlloyDB Omni default max_connections=100 — leaves comfortable
      # room for the other 5–6 pipelines also pulling connections concurrently.
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-40}
    restart: "no"

  member-profile-pipeline:
    container_name: member-profile-pipeline
    build:
      context: .
      dockerfile: member-profile-pipeline/Dockerfile
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local
      MEMBER_UPDATED_TOPIC: member-updated
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-2}
      # Optional comma-separated congress list (e.g. "117,118,119"). When unset, the pipeline
      # falls back to `SELECT DISTINCT congress FROM bills` so it naturally tracks whatever
      # congresses bill-metadata-pipeline has covered. Override for targeted backfill / dev runs.
      MEMBERS_CONGRESSES: ${MEMBERS_CONGRESSES:-}
    restart: "no"

  lis-mapping-refresher:
    container_name: lis-mapping-refresher
    build:
      context: .
      dockerfile: lis-mapping-refresher/Dockerfile
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local
      MEMBER_UPDATED_TOPIC: member-updated
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-1}
    restart: "no"

  committee-membership-refresher:
    container_name: committee-membership-refresher
    build:
      context: .
      dockerfile: committee-membership-refresher/Dockerfile
    # Launcher contract: args(0) = config (unused), args(1) = runId.
    # PipelineBootstrap.extractRunId parses args(1).
    command: ["cfg-unused", "local-committee-run"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-1}
      COMMITTEE_CURRENT_CONGRESS: ${COMMITTEE_CURRENT_CONGRESS:-119}
    restart: "no"

  # One-time historical committee-membership backfill from the GovInfo Congressional Directory. NOT part
  # of normal `up` — gated behind the `backfill` profile, run on demand:
  #   docker compose -f docker-compose.local.yml --profile backfill up committee-history-loader
  # Enumerates committees from the DB, looks each up in the CDIR, and resolves members by name+state for
  # the target congress — so those congresses' member profiles should already be ingested
  # (member-profile-pipeline). Reuses the refresher image; overrides the entrypoint to the loader main class.
  committee-history-loader:
    container_name: committee-history-loader
    profiles: ["backfill"]
    build:
      context: .
      dockerfile: committee-membership-refresher/Dockerfile
    entrypoint:
      ["java", "-XX:MaxRAMPercentage=75.0", "-cp", "app.jar", "repcheck.members.committees.app.CommitteeHistoryLoaderApp"]
    # Launcher contract: args(0) = config (unused), args(1) = runId.
    command: ["cfg-unused", "history-backfill-run"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      GOVINFO_API_KEY: ${GOVINFO_API_KEY}
      COMMITTEE_HISTORY_CURRENT_CONGRESS: ${COMMITTEE_HISTORY_CURRENT_CONGRESS:-119}
      COMMITTEE_HISTORY_LOOKBACK_CONGRESSES: ${COMMITTEE_HISTORY_LOOKBACK_CONGRESSES:-5}
    restart: "no"

  votes-pipeline:
    container_name: votes-pipeline
    build:
      context: .
      dockerfile: votes-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused — PureConfig reads env),
    # args(1) = runId, args(2) = stepRunId. PipelineBootstrap raises
    # RunIdMissing without args(1).
    command: ["cfg-unused", "local-votes-run", "1"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # Congress.gov House votes (real API — no WireMock in local dev).
      CONGRESS_API_BASE_URL: https://api.congress.gov/v3
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      # Senate — real senate.gov URL.
      SENATE_BASE_URL: https://www.senate.gov/legislative/LIS
      # Per P6.H5 the votes pipeline iterates all congresses with bills in the DB. To override,
      # set VOTES_CONGRESSES (comma-separated, e.g. "117,118,119"). Unset = derive from DB.
      #
      # HOUSE_LOOKBACK_DAYS=0 means "no client-side lookback filter — keep every paginated House
      # vote regardless of updateDate". The local-dev stack runs as a backfill / development
      # tool, not a steady-state cron, so we want full ingestion every run for parity with the
      # Senate path (senate.gov returns the entire vote_menu for the session in one request and
      # has no equivalent filter). Cloud-Run-Job production would override this back to 7 (the
      # `HouseVotesConfig.lookbackDays` PureConfig default) so the every-2-hour scheduled tick
      # only re-fetches recently-touched votes. Set HOUSE_LOOKBACK_DAYS=7 (or any positive int)
      # in your shell env to flip back to steady-state mode locally.
      HOUSE_LOOKBACK_DAYS: ${HOUSE_LOOKBACK_DAYS:-0}
      HOUSE_PARALLELISM: ${PIPELINE_PARALLELISM:-1}
      SENATE_PARALLELISM: ${PIPELINE_PARALLELISM:-1}
      # Concurrent in-flight HTTP requests per client (Semaphore permits inside
      # RateLimitedHttpClient). House shares the Congress.gov 5K/hr API-key budget with the
      # other Congress.gov pipelines — keep modest. Senate hits senate.gov which is a separate
      # host with no shared budget — can be higher. Override with HOUSE_PERMITS / SENATE_PERMITS.
      HOUSE_PERMITS: ${HOUSE_PERMITS:-20}
      SENATE_PERMITS: ${SENATE_PERMITS:-8}
      # Per-permit cooldown. Sustained outbound rate ≈ permits / (delay + API response time).
      # With permits=20, page-delay=250ms, and the ~7s Congress.gov /members response time,
      # House peaks at ~2.7 req/sec ≈ 9.7K req/hr — over the 5K/hr free-tier budget shared
      # across pipelines. The retry classifier handles 429s via Retry-After, so the actual
      # sustained rate gets throttled back near the rate limit. For backfill scenarios this
      # tradeoff is fine; for steady-state production lower this back to ~4.
      HOUSE_PAGE_DELAY: ${HOUSE_PAGE_DELAY:-250ms}
      SENATE_REQUEST_DELAY: ${SENATE_REQUEST_DELAY:-200ms}
      # Ember HTTP connection pool size — must be >= sum of HOUSE_PERMITS + SENATE_PERMITS or
      # the conn pool becomes the real bottleneck instead of the per-client semaphores.
      CONGRESS_API_MAX_CONNECTIONS: ${CONGRESS_API_MAX_CONNECTIONS:-30}
      # Pub/Sub — GCP_PROJECT_ID + VOTE_EVENTS_TOPIC match the application.conf keys.
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-local
      VOTE_EVENTS_TOPIC: vote-events
    restart: "no"

  # ---------------------------------------------------------------------------
  # Amendments triplet (per IMPLEMENTATION_PLAN §6.1)
  # ---------------------------------------------------------------------------
  # 1. amendments-pipeline (Cloud Run Job in production; cron-triggered locally)
  # 2. amendment-text-availability-checker (Cloud Run Job; cron-triggered locally)
  # 3. amendment-text-pipeline (Cloud Run Service in production — long-running
  #    Pub/Sub subscriber; cron-triggered locally to drain & exit, matching the
  #    bill-text-pipeline precedent).

  amendments-pipeline:
    container_name: amendments-pipeline
    build:
      context: .
      dockerfile: amendments-pipeline/Dockerfile
    # Launcher contract: args(0) = config (unused — PureConfig reads env),
    # args(1) = runId (PipelineBootstrap.extractRunId parses args(1).toLong;
    # MUST be numeric — non-numeric raises RunIdMissing). args(2) = stepRunId.
    # `1` matches the workflow_runs row seeded by workflow-runs-init, so
    # AmendmentsPipeline's WorkflowStateUpdater.recordStepStarted has a parent
    # FK target.
    command: ["cfg-unused", "1", "1"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      workflow-runs-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      # P1 sizing: max-connections >= parallelism × maxRecursionDepth + 5.
      # With application.conf defaults (parallelism=4, maxRecursionDepth=10)
      # → 45. AmendmentsPipelineResources.validatePoolSizing fails boot if undersized.
      AMENDMENTS_CONGRESSES_MIN: ${AMENDMENTS_CONGRESSES_MIN:-102}
      AMENDMENTS_CONGRESSES_MAX: ${AMENDMENTS_CONGRESSES_MAX:-119}
      # 10-year lookback for local backfill — matches the cross-pipeline policy
      # used by bill-summary-pipeline. Override to 30 for steady-state cron runs.
      AMENDMENTS_LOOKBACK_DAYS: ${AMENDMENTS_LOOKBACK_DAYS:-3650}
      AMENDMENTS_PARALLELISM: ${PIPELINE_PARALLELISM:-2}
      AMENDMENTS_MAX_RECURSION_DEPTH: ${AMENDMENTS_MAX_RECURSION_DEPTH:-10}
    restart: "no"

  amendment-text-availability-checker:
    container_name: amendment-text-availability-checker
    build:
      context: .
      dockerfile: amendment-text-availability-checker/Dockerfile
    # Launcher contract: args(0) = runId (Long), args(1) = stepRunId (Long).
    # Defaults to 0L if missing/unparseable so any token would work, but pass
    # `"1"` so a non-zero runId activates the WorkflowStateUpdater path against
    # the workflow_runs row seeded by workflow-runs-init.
    command: ["1", "1"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
      workflow-runs-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      # 4h cadence per IMPLEMENTATION_PLAN §6.3. staleAfter must be > 0
      # (AmendmentTextCheckerConfig.require), but the SQL filter is
      # `last_text_check_at IS NULL OR older than staleAfter` so freshly-
      # inserted rows qualify regardless. 4h matches the cron cadence —
      # nothing checked within the last cron tick gets re-checked.
      AMENDMENT_TEXT_CHECK_STALE_AFTER: ${AMENDMENT_TEXT_CHECK_STALE_AFTER:-4h}
      AMENDMENT_TEXT_CHECK_PARALLELISM: ${PIPELINE_PARALLELISM:-2}
      # Pub/Sub — publishes AmendmentTextAvailableEvent on the
      # `amendment-text-available` topic (created by pubsub-init.sh).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local
      PUBSUB_TOPIC_NAME: amendment-text-available
    restart: "no"

  amendment-text-pipeline:
    container_name: amendment-text-pipeline
    build:
      context: .
      dockerfile: amendment-text-pipeline/Dockerfile
    # Launcher contract: args(0) = runId (Long), args(1) = stepRunId (Long).
    # `"1"` matches the seeded workflow_runs row (activates WorkflowStateUpdater).
    command: ["1", "1"]
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
      workflow-runs-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      # GovInfo API key — required for CREC granule downloads via
      # CrecGovInfoUrlRewriter. Same key as bill-text-pipeline.
      GOVINFO_API_KEY: ${GOVINFO_API_KEY}
      # Pub/Sub — uses the GCP_PROJECT_ID + EVENT_SUBSCRIBER_SUBSCRIPTION
      # convention (per amendment-text-pipeline/application.conf), mirroring
      # bill-text-pipeline. Override the default subscription name to match
      # what pubsub-init.sh creates (`amendment-text-available-pipeline-sub`,
      # not the application.conf default `amendment-text-available-sub`).
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-local
      EVENT_SUBSCRIBER_SUBSCRIPTION: amendment-text-available-pipeline-sub
      # Drain mode — single Pull RPC pulls up to N messages and the stream
      # exits when the pull batch completes. Pub/Sub caps Pull at 1000.
      EVENT_SUBSCRIBER_MAX_MESSAGES: ${EVENT_SUBSCRIBER_MAX_MESSAGES:-1000}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: bill-text-embedding
      OLLAMA_EMBEDDING_DIMENSIONS: "1024"
      OLLAMA_TIMEOUT_SECONDS: "60"
      OLLAMA_EMBED_BATCH_SIZE: ${OLLAMA_EMBED_BATCH_SIZE:-50}
      OLLAMA_EMBED_BATCH_TIMEOUT: ${OLLAMA_EMBED_BATCH_TIMEOUT:-1s}
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-4}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
    restart: "no"

volumes:
  # Reuse the existing AlloyDB data volume created by the original `repcheck-data-ingestion`
  # compose run (1.2 GB, ~139k bills across 72 congresses). When this worktree's compose first
  # came up it created a fresh per-project volume `cross-bill-embed_alloydbdata` and re-ran
  # migrations against an empty schema, leaving the stack with only ~7k bills (whatever the
  # current run had time to ingest). Pointing at the existing volume by name (external: true)
  # restores the historical data; Liquibase migrations are additive so any new migrations on
  # this branch will run cleanly on top.
  alloydbdata:
    external: true
    name: repcheck-data-ingestion_alloydbdata
  ollamadata:
    driver: local
