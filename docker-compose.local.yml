# =============================================================================
# Docker Compose — Local Development Stack (Real Congress.gov API)
# =============================================================================
# Runs the full bill ingestion pipeline locally against the real Congress.gov
# API. Infrastructure runs in Docker; apps are built and run as containers.
#
# Prerequisites:
#   1. Copy .env.example to .env and set CONGRESS_GOV_API_KEY
#   2. Docker Desktop running
#
# Usage:
#   # Start infrastructure + all pipelines:
#   docker compose -f docker-compose.local.yml up --build
#
#   # Run only infrastructure (DB + Pub/Sub + Ollama), run apps via sbt:
#   docker compose -f docker-compose.local.yml up alloydb pubsub-emulator pubsub-init ollama
#
#   # Run just the metadata pipeline (first step):
#   docker compose -f docker-compose.local.yml up --build alloydb bill-metadata-pipeline
#
#   # Then run checker + text pipeline (after metadata is in DB):
#   docker compose -f docker-compose.local.yml up --build bill-text-availability-checker bill-text-pipeline
#
#   # Tear down (preserves data volumes):
#   docker compose -f docker-compose.local.yml down
#
#   # Tear down and delete all data:
#   docker compose -f docker-compose.local.yml down -v
#
# Pipeline execution order:
#   1. bill-metadata-pipeline  — fetches bill metadata from Congress.gov → DB
#   2. bill-text-availability-checker — scans DB for bills needing text → Pub/Sub
#   3. bill-text-pipeline — subscribes to Pub/Sub → downloads text → embedding → DB
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------

  alloydb:
    image: google/alloydbomni:16.8.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: repcheck
      POSTGRES_USER: repcheck
      POSTGRES_PASSWORD: repcheck
    volumes:
      - alloydbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repcheck -d repcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  pubsub-emulator:
    image: google/cloud-sdk:slim
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=repcheck-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Init container: creates Pub/Sub topics and subscriptions in the emulator
  pubsub-init:
    image: curlimages/curl:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    volumes:
      - ./scripts/pubsub-init.sh:/pubsub-init.sh:ro
    entrypoint: ["sh", "/pubsub-init.sh"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Application Containers
  # ---------------------------------------------------------------------------

  # Step 1: Fetch bill metadata from Congress.gov and store in DB
  bill-metadata-pipeline:
    build:
      context: .
      dockerfile: bill-metadata-pipeline/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PIPELINE_LOOKBACK_DAYS: ${PIPELINE_LOOKBACK_DAYS:-30}
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-4}

  # Step 2: Check which bills have new/updated text versions → publish events
  bill-text-availability-checker:
    build:
      context: .
      dockerfile: bill-text-availability-checker/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: repcheck-local
      PUBSUB_TOPIC_NAME: bill-text-available
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-4}

  # Step 3: Subscribe to text-available events → download text → embed → store
  bill-text-pipeline:
    build:
      context: .
      dockerfile: bill-text-pipeline/Dockerfile
    depends_on:
      alloydb:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      DB_HOST: alloydb
      DB_PORT: "5432"
      DB_NAME: repcheck
      DB_USERNAME: repcheck
      DB_PASSWORD: repcheck
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: repcheck-local
      EVENT_PUBLISHER_TOPIC: bill-text-ingested
      EVENT_SUBSCRIBER_SUBSCRIPTION: bill-text-available-sub
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: qwen3-embedding
      OLLAMA_EMBEDDING_DIMENSIONS: "1536"
      OLLAMA_TIMEOUT_SECONDS: "60"
      PIPELINE_PARALLELISM: ${PIPELINE_PARALLELISM:-4}

volumes:
  alloydbdata:
    driver: local
  ollamadata:
    driver: local
