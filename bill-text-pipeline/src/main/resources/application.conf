# Bill Text Pipeline configuration
# See PureConfig auto-derivation for the config case class

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  download-timeout-seconds = 60
  download-timeout-seconds = ${?DOWNLOAD_TIMEOUT_SECONDS}
  page-delay = 100ms
  page-delay = ${?PAGE_DELAY}
  # GPO's GovInfo API serves authoritative bill text bodies (HTM/XML/PDF) without an anti-bot layer,
  # provided the request carries an api_key query parameter. Free signup at https://www.govinfo.gov/api-signup.
  # Empty default keeps PureConfig load succeeding when GOVINFO_API_KEY isn't set in the env (e.g., in tests
  # that don't exercise the GovInfo path); production runs always set it. An empty key surfaces at runtime
  # as a 401 from api.govinfo.gov on the first download.
  gov-info-api-key = ""
  gov-info-api-key = ${?GOVINFO_API_KEY}
  # Override for tests (point at WireMock); defaults to the production endpoint.
  gov-info-base-url = "https://api.govinfo.gov"
  gov-info-base-url = ${?GOVINFO_BASE_URL}
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  topic-name = "repcheck-ingestion-events"
  topic-name = ${?EVENT_PUBLISHER_TOPIC}
  source = "bill-text-pipeline"
  source = ${?EVENT_PUBLISHER_SOURCE}
}

event-subscriber {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  subscription-id = "bill-text-available-sub"
  subscription-id = ${?EVENT_SUBSCRIBER_SUBSCRIPTION}
  max-messages = 100
  max-messages = ${?EVENT_SUBSCRIBER_MAX_MESSAGES}
  # Defensive cap on every Pub/Sub Pull RPC. Healthy pulls usually return in <1s; if the SDK stalls (occasionally
  # observed against the local emulator after a parEvalMap drain) we treat the timeout as "subscription drained"
  # and terminate the stream cleanly — Ofelia's next tick re-runs the pipeline. Tunable via
  # EVENT_SUBSCRIBER_PULL_TIMEOUT (e.g. "30s", "2m").
  pull-timeout = 30s
  pull-timeout = ${?EVENT_SUBSCRIBER_PULL_TIMEOUT}
}

failure-handler {
  max-retries = 3
  max-retries = ${?FAILURE_HANDLER_MAX_RETRIES}
}

embedding {
  base-url = "http://localhost:11434"
  base-url = ${?OLLAMA_BASE_URL}
  # `bill-text-embedding` is a tuned variant of qwen3-embedding:0.6b registered by ollama/Dockerfile.
  # Generic name (model-agnostic) so future base-model swaps don't require touching this contract.
  model-name = "bill-text-embedding"
  model-name = ${?OLLAMA_MODEL_NAME}
  # qwen3-embedding:0.6b natively emits 1024-dim vectors (truncated MRL output of the family's larger
  # 1536/2560-dim variants). Schema column raw_bill_text.embedding is vector(1024) per migration 028.
  dimensions = 1024
  dimensions = ${?OLLAMA_EMBEDDING_DIMENSIONS}
  timeout-seconds = 30
  timeout-seconds = ${?OLLAMA_TIMEOUT_SECONDS}
  # Per-chunk character cap (BillTextChunker). Sized to match the empirical throughput sweet spot:
  # PLAW benchmark on RTX 2070 SUPER + qwen3-embedding-tuned (PR #71 + follow-up) showed 12k-char
  # chunks complete a 4.5M-char Public Law in 9.3 min sequential vs 10.1 min for 20k chunks
  # because attention is O(n²) per chunk, so larger chunks pay quadratic per-pass cost without
  # proportionally fewer total passes. Stays well inside qwen3-embedding's ~32k-token input window
  # while remaining the per-pass-cost optimum. The 0.6B model could handle larger chunks with its
  # freed VRAM, but bigger inputs dilute embedding semantics (averaged-meaning effect past ~2k
  # tokens), so we hold at 12k and only revisit if a separate retrieval-quality benchmark proves
  # bigger chunks help.
  max-chunk-chars = 12000
  max-chunk-chars = ${?OLLAMA_MAX_CHUNK_CHARS}
  # Chunks per /api/embed array call. Sweet spot per PR-C follow-up benchmark on the 0.6B model:
  # batch=50 reaches GPU saturation (the smaller model frees ~5 GB of VRAM vs the 4B baseline,
  # lifting the saturation point from ~10 to ~50). Override lower if running against a larger
  # model (the 4B / 8B variants saturate at ~10 with the GPU already pinned by single calls).
  embed-batch-size = 50
  embed-batch-size = ${?OLLAMA_EMBED_BATCH_SIZE}
  # Max wait for the cross-bill embedder to collect a full `embed-batch-size` batch before firing
  # whatever it has. Without this, a lone single-chunk bill would block forever waiting for 49
  # more chunks to arrive from other concurrent bills. Tradeoff: shorter timeout = lower per-bill
  # latency at the cost of less-than-full batches under low traffic; longer timeout = better GPU
  # utilization at the cost of higher worst-case per-bill latency. 1s is a comfortable default
  # given embedding takes ~5s per batch — even at full timeout the batch arrives before the GPU
  # finishes the previous one.
  embed-batch-timeout = 1s
  embed-batch-timeout = ${?OLLAMA_EMBED_BATCH_TIMEOUT}
  # Cross-bill embedder queue capacity, expressed as a multiplier of `embed-batch-size`. The bounded queue holds
  # in-flight chunks between producers (per-bill processors) and the single embedder worker. Headroom lets
  # producers keep streaming while the worker is mid-batch; too low and offer() blocks between batches, too high
  # and we accept more memory pressure under burst traffic. 10× is the universal default; tune via
  # OLLAMA_EMBED_QUEUE_CAPACITY_MULTIPLIER.
  embed-queue-capacity-multiplier = 10
  embed-queue-capacity-multiplier = ${?OLLAMA_EMBED_QUEUE_CAPACITY_MULTIPLIER}
}
