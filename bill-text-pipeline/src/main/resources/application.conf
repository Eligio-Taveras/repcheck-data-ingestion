# Bill Text Pipeline configuration
# See PureConfig auto-derivation for the config case class

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  download-timeout-seconds = 60
  download-timeout-seconds = ${?DOWNLOAD_TIMEOUT_SECONDS}
  # Body-size guardrail. Pre-streaming refactor this was a hard heap cap (any body > 10 MiB
  # OOM'd on `response.as[String]`); post-refactor (PR #81) bytes spool to disk in ~64 KiB
  # fs2 chunks so heap is bounded by extraction, not body size. The cap is now a
  # runaway/malicious-URL guard — sized comfortably above the largest legitimate STATUTE PDF
  # we've observed (~75 MiB) so real bills never trip it. Override via env if a single
  # outlier needs a higher ceiling for one run.
  max-content-bytes = 209715200
  max-content-bytes = ${?MAX_CONTENT_BYTES}
  page-delay = 100ms
  page-delay = ${?PAGE_DELAY}
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  topic-name = "repcheck-ingestion-events"
  topic-name = ${?EVENT_PUBLISHER_TOPIC}
  source = "bill-text-pipeline"
  source = ${?EVENT_PUBLISHER_SOURCE}
}

event-subscriber {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  subscription-id = "bill-text-available-sub"
  subscription-id = ${?EVENT_SUBSCRIBER_SUBSCRIPTION}
  max-messages = 100
  max-messages = ${?EVENT_SUBSCRIBER_MAX_MESSAGES}
}

failure-handler {
  max-retries = 3
  max-retries = ${?FAILURE_HANDLER_MAX_RETRIES}
}

embedding {
  base-url = "http://localhost:11434"
  base-url = ${?OLLAMA_BASE_URL}
  # `bill-text-embedding` is a tuned variant of qwen3-embedding:0.6b registered by ollama/Dockerfile.
  # Generic name (model-agnostic) so future base-model swaps don't require touching this contract.
  model-name = "bill-text-embedding"
  model-name = ${?OLLAMA_MODEL_NAME}
  # qwen3-embedding:0.6b natively emits 1024-dim vectors (truncated MRL output of the family's larger
  # 1536/2560-dim variants). Schema column raw_bill_text.embedding is vector(1024) per migration 028.
  dimensions = 1024
  dimensions = ${?OLLAMA_EMBEDDING_DIMENSIONS}
  timeout-seconds = 30
  timeout-seconds = ${?OLLAMA_TIMEOUT_SECONDS}
  # Per-chunk character cap (BillTextChunker). Sized to match the empirical throughput sweet spot:
  # PLAW benchmark on RTX 2070 SUPER + qwen3-embedding-tuned (PR #71 + follow-up) showed 12k-char
  # chunks complete a 4.5M-char Public Law in 9.3 min sequential vs 10.1 min for 20k chunks
  # because attention is O(n²) per chunk, so larger chunks pay quadratic per-pass cost without
  # proportionally fewer total passes. Stays well inside qwen3-embedding's ~32k-token input window
  # while remaining the per-pass-cost optimum. The 0.6B model could handle larger chunks with its
  # freed VRAM, but bigger inputs dilute embedding semantics (averaged-meaning effect past ~2k
  # tokens), so we hold at 12k and only revisit if a separate retrieval-quality benchmark proves
  # bigger chunks help.
  max-chunk-chars = 12000
  max-chunk-chars = ${?OLLAMA_MAX_CHUNK_CHARS}
  # Chunks per /api/embed array call. Sweet spot per PR-C follow-up benchmark on the 0.6B model:
  # batch=50 reaches GPU saturation (the smaller model frees ~5 GB of VRAM vs the 4B baseline,
  # lifting the saturation point from ~10 to ~50). Override lower if running against a larger
  # model (the 4B / 8B variants saturate at ~10 with the GPU already pinned by single calls).
  embed-batch-size = 50
  embed-batch-size = ${?OLLAMA_EMBED_BATCH_SIZE}
}
