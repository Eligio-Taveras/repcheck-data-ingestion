# Bill Text Pipeline configuration
# See PureConfig auto-derivation for the config case class

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 4
  parallelism = ${?PIPELINE_PARALLELISM}
  download-timeout-seconds = 60
  download-timeout-seconds = ${?DOWNLOAD_TIMEOUT_SECONDS}
  max-content-bytes = 10485760
  max-content-bytes = ${?MAX_CONTENT_BYTES}
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?GCP_PROJECT_ID}
  topic-name = "repcheck-ingestion-events"
  topic-name = ${?EVENT_PUBLISHER_TOPIC}
  source = "bill-text-pipeline"
  source = ${?EVENT_PUBLISHER_SOURCE}
}

embedding {
  base-url = "http://localhost:11434"
  base-url = ${?OLLAMA_BASE_URL}
  model-name = "qwen3-embedding"
  model-name = ${?OLLAMA_MODEL_NAME}
  dimensions = 1536
  dimensions = ${?OLLAMA_EMBEDDING_DIMENSIONS}
  timeout-seconds = 30
  timeout-seconds = ${?OLLAMA_TIMEOUT_SECONDS}
}
