# Test configuration overrides for Bill Text Pipeline

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "repcheck"
  password = "repcheck"
  max-connections = 2
}

pipeline {
  parallelism = 1
  download-timeout-seconds = 5
  max-content-bytes = 1048576
}

event-publisher {
  project-id = "repcheck-test"
  topic-name = "test-ingestion-events"
  source = "bill-text-pipeline-test"
}

event-subscriber {
  project-id = "repcheck-test"
  subscription-id = "test-bill-text-available-sub"
  max-messages = 10
}

failure-handler {
  max-retries = 1
}

embedding {
  base-url = "http://localhost:11434"
  model-name = "bill-text-embedding"
  dimensions = 1024
  timeout-seconds = 5
}
