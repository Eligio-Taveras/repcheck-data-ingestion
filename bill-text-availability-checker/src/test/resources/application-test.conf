# Test configuration overrides for Bill Text Availability Checker

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "repcheck"
  password = "repcheck"
  max-connections = 2
}

congress-api {
  base-url = "http://localhost:8080"
  api-key = "test-api-key"
  retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
    backoff-multiplier = 1.0
  }
}

pipeline {
  parallelism = 1
  event-publish-retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
    backoff-multiplier = 1.0
  }
}

event-publisher {
  topic-name = "test-ingestion-events"
  source = "bill-text-availability-checker-test"
}
