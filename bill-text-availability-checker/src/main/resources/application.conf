# Bill Text Availability Checker configuration
# See PureConfig auto-derivation for the config case class

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. Default 750ms keeps this pipeline's
  # call rate at ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr free-tier rate limit.
  # Aligned with bill-metadata-pipeline + member-profile-pipeline since all three share the same API key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  # Retry schedule for Congress.gov fetch failures. Bumped from max-retries=3, initial=10ms after
  # observing that the old 70ms total backoff was nowhere near long enough for an upstream socket /
  # rate-limit window to recover from a 429. New schedule: 1s, 2s, 4s, 8s, 16s, 32s, 60s (capped),
  # 60s, 60s, 60s — total ~250s before the per-call error propagates and the retry wrapper gives up.
  # Aligned with bill-metadata-pipeline retry config since both share the same Congress.gov key.
  retry {
    max-retries = 10
    initial-backoff-ms = 1000
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # Default 2 to keep the shared Congress.gov API key under its per-key rate limit
  # when multiple pipelines run concurrently.
  parallelism = 2
  parallelism = ${?PIPELINE_PARALLELISM}
  event-publish-retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  # Comma-separated list of congresses to include in the sweep. Default = 103-119 (Congress.gov's
  # documented bill-text coverage range, https://www.congress.gov/help/coverage-dates). Pre-103
  # bills get `expected_text_version_code` populated by the metadata pipeline's chamber-floor
  # write but Congress.gov returns no text body for them, so including them just burns API budget.
  # When a new congress opens (e.g. 120 in 2027), append it here or override via env.
  # Empty string = no congress filter (sweep everything — for one-off backfills only).
  congresses = "103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119"
  congresses = ${?BILL_TEXT_CHECK_CONGRESSES}
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?PUBSUB_PROJECT_ID}
  topic-name = "bill-events"
  topic-name = ${?PUBSUB_TOPIC_NAME}
  source = "bill-text-availability-checker"
}
