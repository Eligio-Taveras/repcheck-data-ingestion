# Amendments Pipeline configuration
# Ingests Congressional amendments from Congress.gov /v3/amendment endpoints. Single data
# source, simple upsert, no history archival — see docs/architecture/acceptance-criteria/
# 07-AMENDMENTS-PIPELINE.md for the system context.

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  # P1 sizing rule: max-connections >= parallelism × maxRecursionDepth + 5.
  # With defaults parallelism=4 and maxRecursionDepth=10 that's 4 × 10 + 5 = 45.
  # Recursion can hold up to `parallelism × maxRecursionDepth` connections concurrently when the
  # entire ancestor chain is cold; the +5 buffer covers the workflow-state writer + bookkeeping
  # queries running alongside the main pipeline. With the bills-pipeline default of 10, a deep
  # chain at parallelism=4 deadlocks. AmendmentsPipeline validates this at boot and refuses to
  # start when the pool is undersized.
  max-connections = 45
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  page-size = ${?CONGRESS_API_PAGE_SIZE}
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. 750ms keeps the call
  # rate at ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr rate limit.
  # Aligned with bill-metadata-pipeline + bill-text-availability-checker + member-profile-pipeline
  # since all five pipelines share the same key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # Inclusive lower bound of the Congress range to ingest. Default is 102 (Constants.MinAmendmentCongress) —
  # Congress.gov's amendments API does not return data for earlier sessions and the schema's CHECK constraint
  # rejects them. Bump this for backfill scoping.
  congresses-min = 102
  congresses-min = ${?AMENDMENTS_CONGRESSES_MIN}

  # Inclusive upper bound. Default is 119 (current). Update on each new Congress; consider keeping this in sync
  # with the bills/votes pipelines.
  congresses-max = 119
  congresses-max = ${?AMENDMENTS_CONGRESSES_MAX}

  # Window subtracted from `now` to compute fromDateTime on each list-page request. 7 days keeps steady-state
  # scans tight; bump for backfill runs.
  lookback-days = 7
  lookback-days = ${?AMENDMENTS_LOOKBACK_DAYS}

  # In-flight detail fetches in the processor pipeline.
  parallelism = 4
  parallelism = ${?AMENDMENTS_PARALLELISM}

  # Inter-page delay surfaced separately from the API client's page-delay so a future processor-level rate
  # limiter can be tuned independently.
  page-delay = 0ms
  page-delay = ${?AMENDMENTS_PAGE_DELAY}

  # Reserved for the parent-amendment chase: how deep into amendments-of-amendments to follow before giving up.
  # Production data rarely exceeds depth 3.
  max-recursion-depth = 10
  max-recursion-depth = ${?AMENDMENTS_MAX_RECURSION_DEPTH}

  # Items requested per list page. 250 is the Congress.gov maximum.
  page-size = 250
  page-size = ${?AMENDMENTS_PAGE_SIZE}
}
