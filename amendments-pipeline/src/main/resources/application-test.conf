include "application.conf"

# Test overrides: tighten everything so unit / integration tests run quickly and deterministically.
congress-api {
  base-url = "http://127.0.0.1:8080/v3"
  api-key = "test-key"
  page-size = 10
  page-delay = 1ms
  retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
  }
  http {
    request-timeout = 5s
  }
}

pipeline {
  congresses-min = 117
  congresses-max = 119
  lookback-days = 7
  parallelism = 2
  page-delay = 1ms
  max-recursion-depth = 3
  page-size = 10
}

database {
  # parallelism (2) * maxRecursionDepth (3) + 5 = 11 — matches the P1 sizing rule for the test profile.
  max-connections = 11
}
