include "application.conf"

# Test overrides: tighten everything so unit / integration tests run quickly and deterministically.
congress-api {
  base-url = "http://127.0.0.1:8080/v3"
  api-key = "test-key"
  page-size = 10
  page-delay = 1ms
  retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
  }
  http {
    request-timeout = 5s
  }
}

pipeline {
  initial-lookback-days = 30
  watermark-buffer = 1s
  congresses = [118]
  step-name = "bill-summary-pipeline-test"
}

database {
  max-connections = 3
}
