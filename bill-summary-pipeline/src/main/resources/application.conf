# Bill Summary Pipeline configuration
# Maps Congress.gov /summaries[/{congress}] feed to bills.expected_text_version_code via
# SummaryVersionCodeMapper (see repcheck-shared-models). Acts as an advancing writer alongside
# bill-metadata-pipeline's introduced floor — TextVersionCode.progressionOrder gates updates so
# neither pipeline can downgrade the other's writes.

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 5
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  page-size = ${?CONGRESS_API_PAGE_SIZE}
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. 750ms keeps the call rate
  # at ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr rate limit. Aligned
  # with bill-metadata-pipeline + bill-text-availability-checker + member-profile-pipeline since
  # all four share the same key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # First-run-only lookback window. Subsequent runs use the watermark from workflow_run_steps
  # (lastSuccessfulEndAt - watermark-buffer). 10-year default per cross-pipeline policy: every
  # paginated pipeline starts with at least 2-year history, prefer 10.
  initial-lookback-days = 3650
  initial-lookback-days = ${?PIPELINE_INITIAL_LOOKBACK_DAYS}

  # Buffer subtracted from the previous run's end-time when computing fromDateTime. Catches
  # summaries that updated AFTER the previous run's toDateTime cutoff but before the run finished.
  watermark-buffer = 5m
  watermark-buffer = ${?PIPELINE_WATERMARK_BUFFER}

  # Iterate these congresses sequentially within each tick. Configurable so backfill can broaden
  # to historical congresses (e.g. [114, 115, 116, 117, 118, 119]) and steady-state can narrow to
  # the active session ([119]) once caught up.
  congresses = [119]
  congresses = ${?PIPELINE_CONGRESSES}

  # Step name used as the workflow_run_steps key for watermark queries. Keep stable across
  # deploys — changing it forces a one-time fall-back to the initial-lookback-days window.
  step-name = "bill-summary-pipeline"

  # Maximum in-flight requests against the Congress.gov client (Semaphore permit count).
  # `1` keeps this pipeline's call rate strictly serial and friendly to the shared API key;
  # configurable so we can lift it without a redeploy if Congress.gov ever loosens limits.
  http-concurrency = 1
  http-concurrency = ${?PIPELINE_HTTP_CONCURRENCY}
}
