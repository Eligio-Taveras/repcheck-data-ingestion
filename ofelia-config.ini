[job-run "bill-metadata"]
schedule = 0 */6 * * *
container = bill-metadata-pipeline

; bill-summary-pipeline at minute 30 of the same 6-hour grid — runs ~30 minutes after
; bill-metadata so any newly-introduced bills bill-metadata floored to IH/IS get a chance
; to be advanced by CRS summaries arriving in the same window. The advancing-writer pattern
; uses TextVersionCode.progressionOrder as a regression guard so ordering is for cache
; locality, not correctness.
[job-run "bill-summary"]
schedule = 30 */6 * * *
container = bill-summary-pipeline

[job-run "bill-checker"]
schedule = 0 1,7,13,19 * * *
container = bill-text-availability-checker

[job-run "bill-text"]
schedule = 0 2,8,14,20 * * *
container = bill-text-pipeline

[job-run "member-profile"]
schedule = 0 3,9,15,21 * * *
container = member-profile-pipeline

[job-run "lis-mapping"]
schedule = 0 4,10,16,22 * * *
container = lis-mapping-refresher

; votes-pipeline runs at hour +5 per C6 plan decision 21t — 5-hour offset
; from bill-metadata so it lands AFTER lis-mapping-refresher. That ordering
; keeps lis_member_mapping fresh when votes-pipeline's LisResolver attributes
; Senate positions, minimising placeholder churn.
[job-run "votes"]
schedule = 0 5,11,17,23 * * *
container = votes-pipeline

; -----------------------------------------------------------------------------
; Amendments triplet — separate 4-hour cadence per IMPLEMENTATION_PLAN §6.3 L10.
; The 30 / 50 / next-hour-0 spread gives amendments-pipeline time to complete
; before the checker scans, and the checker time to publish events before the
; text-pipeline drains them.
; -----------------------------------------------------------------------------

[job-run "amendments"]
schedule = 30 */4 * * *
container = amendments-pipeline

; amendment-text-availability-checker: +20 minutes after amendments-pipeline.
; Per the plan: "20-minute offset gives amendments-pipeline time to complete
; before the checker scans".
[job-run "amendment-text-checker"]
schedule = 50 */4 * * *
container = amendment-text-availability-checker

; amendment-text-pipeline: +30 minutes after the checker (next hour, minute 0).
; In production this is a long-running Cloud Run Service; locally we drain via
; cron-triggered single-Pull (mirrors the bill-text-pipeline pattern). The
; +30m buffer gives the checker time to publish events before the subscriber
; pulls them.
[job-run "amendment-text-pipeline"]
schedule = 0 1,5,9,13,17,21 * * *
container = amendment-text-pipeline
