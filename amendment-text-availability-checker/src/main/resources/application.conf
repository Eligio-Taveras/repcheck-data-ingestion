# Amendment Text Availability Checker configuration
# See PureConfig auto-derivation for the config case classes.

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 5
  max-connections = ${?DB_MAX_CONNECTIONS}
}

congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  # Inter-request delay enforced by the per-pipeline rateLimitedClient. 750ms keeps the call rate at
  # ~80 req/min = ~4800 req/hr, comfortably under the Congress.gov 5K/hr free-tier rate limit and
  # aligned with the other Congress.gov-consuming pipelines that share the same key.
  page-delay = 750ms
  page-delay = ${?CONGRESS_API_PAGE_DELAY}
  retry {
    max-retries = 10
    initial-backoff-ms = 1000
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # Inclusive lower bound for amendments included in the candidate query. Congress.gov's
  # `/amendment/.../text` endpoint only serves text granules for 117th Congress and later (per upstream
  # docs), so 117 is both the default and the practical floor. Bump for backfill scoping.
  min-congress = 117
  min-congress = ${?AMENDMENT_TEXT_CHECK_MIN_CONGRESS}

  # An amendment that has already been checked is re-polled only when `last_text_check_at` is older
  # than this window. Mirrors the cron cadence (every 4h) so each amendment is touched once per cron
  # cycle.
  stale-after = 4h
  stale-after = ${?AMENDMENT_TEXT_CHECK_STALE_AFTER}

  # In-flight per-amendment fetches. Default 2 to keep the shared Congress.gov API key
  # under its per-key rate limit when multiple pipelines run concurrently.
  parallelism = 2
  parallelism = ${?AMENDMENT_TEXT_CHECK_PARALLELISM}

  event-publish-retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?PUBSUB_PROJECT_ID}
  topic-name = "amendment.text.available"
  topic-name = ${?PUBSUB_TOPIC_NAME}
  source = "amendment-text-availability-checker"
}
