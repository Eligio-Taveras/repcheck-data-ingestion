# Test configuration overrides for Amendment Text Availability Checker.

include "application.conf"

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "repcheck"
  password = "repcheck"
  max-connections = 2
}

congress-api {
  base-url = "http://localhost:8080"
  api-key = "test-api-key"
  page-size = 10
  page-delay = 1ms
  retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
    backoff-multiplier = 1.0
  }
  http {
    request-timeout = 5s
  }
}

pipeline {
  min-congress = 117
  stale-after = 1m
  parallelism = 1
  page-delay = 1ms
  page-size = 10
  event-publish-retry {
    max-retries = 1
    initial-backoff-ms = 1
    max-backoff-ms = 10
    backoff-multiplier = 1.0
  }
}

event-publisher {
  project-id = "repcheck-test"
  topic-name = "test-amendment-text-available"
  source = "amendment-text-availability-checker-test"
}
