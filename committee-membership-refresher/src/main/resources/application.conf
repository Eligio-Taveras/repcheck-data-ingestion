# Committee Membership Refresher configuration

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 1
  parallelism = ${?PIPELINE_PARALLELISM}
  request-timeout = 30s
  request-timeout = ${?PIPELINE_REQUEST_TIMEOUT}
  current-congress = 119
  current-congress = ${?COMMITTEE_CURRENT_CONGRESS}
  page-size = 250
  page-size = ${?COMMITTEE_PAGE_SIZE}
  house-member-data-url = "https://clerk.house.gov/xml/lists/MemberData.xml"
  house-member-data-url = ${?COMMITTEE_HOUSE_MEMBER_DATA_URL}
  senate-identity-url = "https://www.senate.gov/legislative/LIS_MEMBER/cvc_member_data.xml"
  senate-identity-url = ${?COMMITTEE_SENATE_IDENTITY_URL}
  senate-committee-base-url = "https://www.senate.gov/general/committee_membership"
  senate-committee-base-url = ${?COMMITTEE_SENATE_COMMITTEE_BASE_URL}
}

# One-time historical committee-membership loader (CommitteeHistoryLoaderApp). Reads the canonical
# TSV produced from a historical source (e.g. the Stewart Congressional Committee Assignments dataset).
historical {
  file-path = "/data/committee-history.tsv"
  file-path = ${?COMMITTEE_HISTORY_FILE_PATH}
  parallelism = 2
  parallelism = ${?COMMITTEE_HISTORY_PARALLELISM}
}

congress-gov {
  api-key = ${?CONGRESS_GOV_API_KEY}
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_GOV_BASE_URL}
  page-size = 250
  page-size = ${?CONGRESS_GOV_PAGE_SIZE}
  page-delay = 250ms
  page-delay = ${?CONGRESS_GOV_PAGE_DELAY}
  retry {
    max-retries = 3
    initial-backoff-ms = 500
    max-backoff-ms = 30000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
}

fetch-retry {
  max-retries = 3
  initial-backoff-ms = 500
  max-backoff-ms = 30000
  backoff-multiplier = 2.0
}
