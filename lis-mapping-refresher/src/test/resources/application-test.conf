# Test configuration overrides for LIS Mapping Refresher

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "test"
  password = "test"
  max-connections = 2
}

pipeline {
  parallelism = 1
  request-timeout = 5s
  current-congress = 118
  congress-lookback-window = 5
  senator-xml-url = "https://www.senate.gov/general/contact_information/senators_cfm.xml"
}

fetch-retry {
  max-retries = 0
  initial-backoff-ms = 1
  max-backoff-ms = 10
  backoff-multiplier = 1.0
}

event-publisher {
  project-id = "repcheck-test"
  topic-name = "test-member-events"
  source = "lis-mapping-refresher-test"
}
