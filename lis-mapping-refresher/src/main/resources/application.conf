# LIS Mapping Refresher configuration

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  max-connections = 10
  max-connections = ${?DB_MAX_CONNECTIONS}
}

pipeline {
  parallelism = 1
  parallelism = ${?PIPELINE_PARALLELISM}
  request-timeout = 30s
  request-timeout = ${?PIPELINE_REQUEST_TIMEOUT}
  current-congress = 118
  current-congress = ${?PIPELINE_CURRENT_CONGRESS}
  congress-lookback-window = 5
  congress-lookback-window = ${?PIPELINE_CONGRESS_LOOKBACK_WINDOW}
  senator-xml-url = "https://www.senate.gov/general/contact_information/senators_cfm.xml"
  senator-xml-url = ${?PIPELINE_SENATOR_XML_URL}
}

fetch-retry {
  max-retries = 3
  initial-backoff-ms = 10
  max-backoff-ms = 60000
  backoff-multiplier = 2.0
}

event-publisher {
  project-id = "repcheck-dev"
  project-id = ${?PUBSUB_PROJECT_ID}
  topic-name = "member-events"
  topic-name = ${?PUBSUB_TOPIC_NAME}
  source = "lis-mapping-refresher"
}
