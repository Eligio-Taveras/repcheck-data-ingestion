# Votes Pipeline — test-only configuration overrides
# Used by `VotesPipelineUnitSpec` / `VotesPipelineIntegrationSpec` to avoid requiring env vars or real GCP.
# All delays / parallelism are set to tight values so tests run fast.

database {
  host = "localhost"
  port = 5432
  database = "repcheck_test"
  username = "test"
  password = "test"
  max-connections = 3
}

congress-api {
  base-url = "http://localhost:8080"
  api-key = "test-api-key"
  page-size = 10
  page-delay = 1ms
  retry {
    max-retries = 0
    initial-backoff-ms = 1
    max-backoff-ms = 10
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 2s
    request-timeout = 5s
    max-total-connections = 5
    idle-timeout = 5s
  }
}

pipeline {
  house {
    congress = 118
    session = 1
    parallelism = 1
    page-delay = 1ms
    # lookback = 0 disables the client-side filter — integration tests accept every fixture vote
    lookback-days = 0
  }
  senate {
    base-url = "http://localhost:8080"
    parallelism = 1
    request-delay = 1ms
    retry {
      max-retries = 0
      initial-backoff-ms = 1
      max-backoff-ms = 10
      backoff-multiplier = 2.0
    }
  }
}

event-publisher {
  project-id = "repcheck-test"
  topic-name = "vote-events-test"
  source = "votes-pipeline-test"
}
