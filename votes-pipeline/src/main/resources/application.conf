# Votes Pipeline — production configuration
# See `VotesPipeline.AppConfig` (PureConfig auto-derivation) for the case-class shape.
# All values are overridable via environment variables so the same JAR ships to dev / staging / prod.

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "repcheck"
  database = ${?DB_NAME}
  username = "repcheck"
  username = ${?DB_USERNAME}
  password = "repcheck"
  password = ${?DB_PASSWORD}
  # Tight pool so 7+ pipelines can coexist under AlloyDB Omni's default max_connections ~= 100
  # (C6 execution plan decision 21e). Peak in-flight Doobie ops: House (1) + Senate (1) +
  # event publisher (1) + migration runner startup (1) = 4 → pool of 5 has minimal headroom.
  max-connections = 5
  max-connections = ${?DB_MAX_CONNECTIONS}
}

# Congress.gov API — used by the House JSON client. Senate side does NOT hit this host;
# senate.gov XML uses its own host config under `pipeline.senate.base-url`.
congress-api {
  base-url = "https://api.congress.gov/v3"
  base-url = ${?CONGRESS_API_BASE_URL}
  api-key = ${?CONGRESS_GOV_API_KEY}
  page-size = 250
  page-size = ${?CONGRESS_API_PAGE_SIZE}
  # The base-trait default delay — ignored in practice because the per-client
  # `rateLimitedClient` wrapper in VotesPipeline owns actual pacing via `pipeline.house.page-delay`.
  page-delay = 2s
  retry {
    max-retries = 3
    initial-backoff-ms = 10
    max-backoff-ms = 60000
    backoff-multiplier = 2.0
  }
  http {
    connect-timeout = 10s
    request-timeout = 30s
    max-total-connections = 10
    idle-timeout = 60s
  }
  short-page-retries = 10
  short-page-retries = ${?CONGRESS_API_SHORT_PAGE_RETRIES}
}

pipeline {
  # Optional list of congresses to ingest. Defaults to empty so the pipeline queries
  # the bills table at startup for `SELECT DISTINCT congress` and ingests every congress
  # that has at least one bill in the DB.
  #
  # Three resolution layers, in order of precedence (highest first):
  #   1. VOTES_CONGRESSES env var (comma-separated, e.g. "117,118,119") — read at runtime
  #      via sys.env in `VotesPipeline.resolveCongresses`. NOT bound here because HOCON
  #      cannot parse a comma-separated string as `List[Int]`.
  #   2. This config-file list (e.g. for test profiles).
  #   3. DB-derived from the bills table.
  congresses = []

  house {
    parallelism = 1
    parallelism = ${?HOUSE_PARALLELISM}
    # Maximum concurrent in-flight HTTP requests (Semaphore permits inside RateLimitedHttpClient).
    # `parallelism` queues callers in front of the semaphore; `permits` controls how many actually run at once.
    # Default 1 preserves strictly-serial behaviour; raise (e.g. 4) for backfill speed, mindful of the
    # shared Congress.gov 5K/hr budget across all pipelines using the same API key.
    permits = 1
    permits = ${?HOUSE_PERMITS}
    page-delay = 2s
    page-delay = ${?HOUSE_PAGE_DELAY}
    # Lookback window for client-side filtering. Beta /house-vote endpoint doesn't accept
    # `fromDateTime`, so we fetch all pages and filter in-memory by `updateDate >= now - lookbackDays`.
    # 7 days matches the expected orchestrator cadence (~daily runs with safety margin).
    lookback-days = 7
    lookback-days = ${?HOUSE_LOOKBACK_DAYS}
  }
  senate {
    base-url = "https://www.senate.gov/legislative/LIS"
    base-url = ${?SENATE_BASE_URL}
    parallelism = 1
    parallelism = ${?SENATE_PARALLELISM}
    # Concurrent in-flight permits for senate.gov XML fetches. senate.gov is a separate host
    # from Congress.gov so it doesn't compete for the 5K/hr API-key budget — can be tuned more
    # aggressively. Be considerate of senate.gov's tolerance though (no published rate-limit doc).
    permits = 1
    permits = ${?SENATE_PERMITS}
    request-delay = 3s
    request-delay = ${?SENATE_REQUEST_DELAY}
    retry {
      max-retries = 3
      initial-backoff-ms = 10
      max-backoff-ms = 60000
      backoff-multiplier = 2.0
    }
  }
}

event-publisher {
  project-id = ${?GCP_PROJECT_ID}
  topic-name = "vote-events"
  topic-name = ${?VOTE_EVENTS_TOPIC}
  source = "votes-pipeline"
}
